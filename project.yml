name: LivingReader
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    # SwiftSoup 2.13.9; immutable revision, not a moving tag/range.
    revision: 18b80329749eca5ea29fc50211dca5c7eff5bfec
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    # Theme controlled in-app (system/light/dark); do not force Dark at Info.plist level.
    INFOPLIST_KEY_CFBundleDisplayName: GenBooks
targets:
  LivingReader:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Features
      - path: Core
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.livingreader
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: GenBooks
        INFOPLIST_KEY_UIBackgroundModes: audio
        CODE_SIGN_ENTITLEMENTS: App/LivingReader.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: App/LivingReader.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jarvis.livingreader
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GenBooks
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: >-
          GenBooks uses the microphone when you tap or hold the mic button to talk to BookBot.
          Tap again or release your hold to send. Audio is used for dictation, not saved as a recording.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns what you say into a question for BookBot. It stays on device
          when your iPhone supports it.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.jarvis.livingreader
            CFBundleURLSchemes:
              - genbooks
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - epub
            LSItemContentTypes:
              - org.idpf.epub-container
              - org.idpf.epub-zip
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - pdf
            LSItemContentTypes:
              - com.adobe.pdf
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB
            UTTypeConformsTo:
              - public.data
              - public.composite-content
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
              public.mime-type:
                - application/epub+zip
    dependencies:
      - package: SwiftSoup
      - target: GenBooksShare
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - LivingReaderTests
        - LivingReaderUITests
  GenBooksShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.livingreader.share
        PRODUCT_NAME: GenBooksShare
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: GenBooks
        CODE_SIGN_ENTITLEMENTS: ShareExtension/GenBooksShare.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: ShareExtension/GenBooksShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jarvis.livingreader
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: GenBooks
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationSupportsFileWithMaxCount: 1
  LivingReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LivingReaderTests
    dependencies:
      - target: LivingReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.livingreader.tests
        GENERATE_INFOPLIST_FILE: YES
  LivingReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LivingReaderUITests
    dependencies:
      - target: LivingReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.livingreader.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LivingReader
schemes:
  LivingReader:
    build:
      targets:
        LivingReader: all
        GenBooksShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LivingReaderTests
        - LivingReaderUITests
